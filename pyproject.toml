[project]
name = "thabat-backend"
version = "0.1.0"
description = "THABAT (ثبات) backend — modular monolith, FastAPI + PostgreSQL/pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "python-json-logger>=2.0.7",
    "anthropic>=0.39.0",
    "cohere>=5.11.0",
    "pgvector>=0.3.5",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (function call in default arg) is disabled: `Depends(...)` in a
# default argument is FastAPI's standard, documented dependency-injection
# pattern, not a bug. E501 not selected — line-length is a formatter
# concern, not a correctness one, for this codebase.
ignore = ["B008", "UP042"]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
