services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: thabat
      POSTGRES_PASSWORD: thabat
      POSTGRES_DB: thabat
    ports:
      - "5433:5432"
    volumes:
      - thabat_pgdata:/var/lib/postgresql/data

volumes:
  thabat_pgdata:
